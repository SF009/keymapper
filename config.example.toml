[display]
width=1920
height=1080

[devices]
keyboard="/dev/input/by-id/YOUR-KEYBOARD-event-kbd"
mouse="/dev/input/by-id/YOUR-MOUSE-event-mouse"

[joystick]
up="W"
down="S"
left="A"
right="D"
center_x=0.15
center_y=0.76
radius=0.085
slot=0

[aim]
button="MOUSE_RIGHT"
center_x=0.50
center_y=0.50
sensitivity=2.0
slot=1
invert_y=false
# touch = compatible absolute aim; relative = unbounded FPS mouse aim
mode="relative"

[[taps]]
key="SPACE"
x=0.86
y=0.86
slot=2

[[taps]]
key="R"
x=0.93
y=0.18
slot=3

[[holds]]
key="F"
x=0.78
y=0.84
slot=4

[performance]
grab=true
realtime=true
mouse_lock = false
# F8 toggles capture: locked -> desktop mouse released, unlocked -> capture again
mouse_toggle_key="F8"


[[mouse_holds]]
button="MOUSE_LEFT"
x=0.88
y=0.78
slot=5
